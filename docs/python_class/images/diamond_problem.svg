<svg xmlns="http://www.w3.org/2000/svg" width="500" height="480" viewBox="0 0 500 480">
  <!-- 배경 -->
  <rect width="500" height="480" fill="#f7f3ee" rx="12"/>

  <!-- 제목 -->
  <text x="250" y="35" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#1a1410">Diamond Problem</text>

  <!-- ===== Character 박스 (상단) ===== -->
  <rect x="160" y="55" width="180" height="70" rx="8" fill="#fff" stroke="#7a6f65" stroke-width="1.5"/>
  <text x="250" y="78" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#1a1410">Character</text>
  <line x1="160" y1="86" x2="340" y2="86" stroke="#e8e4df" stroke-width="1"/>
  <text x="250" y="108" text-anchor="middle" font-family="monospace" font-size="11" fill="#7a6f65">def attack(self): ...</text>

  <!-- ===== Warrior 박스 (좌측) ===== -->
  <rect x="40" y="195" width="180" height="70" rx="8" fill="#fff" stroke="#1a7abf" stroke-width="2"/>
  <text x="130" y="218" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#1a7abf">Warrior(Character)</text>
  <line x1="40" y1="226" x2="220" y2="226" stroke="#e8f3ff" stroke-width="1"/>
  <text x="130" y="248" text-anchor="middle" font-family="monospace" font-size="11" fill="#1a7abf">def attack(self): ...</text>

  <!-- ===== Wizard 박스 (우측) ===== -->
  <rect x="280" y="195" width="180" height="70" rx="8" fill="#fff" stroke="#2eaa6e" stroke-width="2"/>
  <text x="370" y="218" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#2eaa6e">Wizard(Character)</text>
  <line x1="280" y1="226" x2="460" y2="226" stroke="#f0fbf5" stroke-width="1"/>
  <text x="370" y="248" text-anchor="middle" font-family="monospace" font-size="11" fill="#2eaa6e">def attack(self): ...</text>

  <!-- ===== MagicWarrior 박스 (하단) ===== -->
  <rect x="160" y="335" width="180" height="55" rx="8" fill="#fff" stroke="#c47d00" stroke-width="2"/>
  <text x="250" y="358" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#c47d00">MagicWarrior</text>
  <text x="250" y="375" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="#c47d00">(Warrior, Wizard)</text>

  <!-- ===== 화살표 ===== -->

  <!-- Warrior → Character -->
  <line x1="150" y1="195" x2="206.8" y2="133.8" stroke="#7a6f65" stroke-width="1.5"/>
  <polygon points="215,125 211.2,137.9 202.4,129.7" fill="#7a6f65"/>

  <!-- Wizard → Character -->
  <line x1="350" y1="195" x2="293.2" y2="133.8" stroke="#7a6f65" stroke-width="1.5"/>
  <polygon points="285,125 297.6,129.7 288.8,137.9" fill="#7a6f65"/>

  <!-- MagicWarrior → Warrior -->
  <line x1="215" y1="335" x2="160" y2="273.9" stroke="#7a6f65" stroke-width="1.5"/>
  <polygon points="152,265 164.5,269.9 155.6,277.9" fill="#7a6f65"/>

  <!-- MagicWarrior → Wizard -->
  <line x1="285" y1="335" x2="340" y2="273.9" stroke="#7a6f65" stroke-width="1.5"/>
  <polygon points="348,265 344.4,277.9 335.5,269.9" fill="#7a6f65"/>

  <!-- ===== 하단 검은 박스 ===== -->
  <rect x="20" y="408" width="460" height="52" rx="6" fill="#1e1c1a"/>
  <text x="250" y="427" text-anchor="middle" font-family="monospace" font-size="11" fill="#f0e6d3">Python의 MRO를 통한 Diamond Problem 해결</text>
  <text x="250" y="448" text-anchor="middle" font-family="monospace" font-size="11" fill="#79c0ff">MagicWarrior → Warrior → Wizard → Character → object</text>
</svg>
