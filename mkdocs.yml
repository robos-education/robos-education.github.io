site_name: My Tech Log
site_url: https://robo-education.github.io/
site_description: GitHub Page + MkDocs 설정 Note
site_author: deoneo@naver.com

repo_name: robos-education/robos-education.github.io
repo_url: https://github.com/robos-education/robos-education.github.io

theme:
  name: material
  language: ko

  palette:              # mode toggle 사용
    - scheme: default
      primary: custom # indigo # css의 사용자 정의를 사용한다.
      accent: custom # indigo
      toggle:
        icon: material/brightness-7
        name: Dark Mode
    - scheme: slate
      primary: custom # indigo
      accent: custom # indigo
      toggle:
        icon: material/brightness-4
        name: Light Mode

  font:
    text: Noto Sans KR
    code: Noto Sans Mono    # 한국어 지원 고정폭 폰트

  icon:
    logo: material/book-open-page-variant   # 파일로 만들어 설정할 수 있다.(assets/logo.png)
  favicon: assets/favicon.png             # local에서 안보일 수 있다.

  features:
    - navigation.path          # 본문 위 breadcrumb만 킨다. (docs를 폴더 구조로 만들고 test)
    - navigation.sections      # 사이드 바의 목록이 펼쳐져있는 상태로 (docs를 폴더 구조로 만들고 test)
    - navigation.indexs        # 폴더명을 클릭하면 내부 index.md로 이동 (docs를 폴더 구조로 만들고 test)
    - navigation.top           # 스크롤 내리면 맨 위로 버튼 표시
    - navigation.footer        # 페이지 하단에 이전/다음 페이지 버튼
    # - navigation.tabs          # 상단에 탭 메뉴 표시
    - search.highlight         # 검색 결과 강조
    - search.suggest           # 검색 자동완성
    - content.code.copy        # 코드 블록에 복사 버튼 추가

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:       # code highlight 사용
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tasklist:
      custom_checkbox: true   # checkbox 디자인을 Material theme 사용
  - tables
  - toc:
      permalink: true         # 제목에 아이콘 붙혀준다.
  - footnotes

copyright: Copyright &copy; 2026 삼산 Robos
extra:
  generator: false        # 하단에 MkDocs theme 표시하지 않음"

# 3. 플러그인 설정 (★redirect★)
plugins:
  - search
  - redirects:
      redirect_maps:
        'index.md': '01_intro.md'
  - toggle-sidebar:
      toggle_button: toc            # toc만 toggle ( 목차만 ), (toc, navigation, all)
      show_toc_by_default: true     # 처음엔 보이게
      button_toggle_toc_tooltip: "목차 보이기/숨기기"   # Mouse Over
      # theme: material